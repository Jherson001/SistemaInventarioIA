name: Keep Render awake

# Evita que el backend free de Render se duerma.
# Cada 25 min (menos carga en runners free de GitHub).
on:
  schedule:
    - cron: "*/25 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health
        run: |
          set -e
          URL="https://sistema-inventario-backend-9im6.onrender.com/health"
          echo "GET $URL"
          for i in 1 2 3; do
            if curl -fsS --max-time 45 "$URL"; then
              echo
              echo "OK (attempt $i)"
              exit 0
            fi
            echo "Retry $i..."
            sleep 8
          done
          echo "Health check failed"
          exit 1
